  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:#15110e;}

  .slide-img{display:block;width:100%;height:auto;}
  /* Both buttons were baked into the slide-22 image; that flat art is
     erased from the image now (see slide-22.jpg) and replaced by a
     real button bar below it, in normal document flow. A fixed
     percentage-of-image overlay can't hold this much text at every
     viewport width without wrapping over the content above it -- a
     bar with real width to grow into has no such limit. */
  .cta-bar{
    display:flex; flex-wrap:wrap; gap:14px;
    padding:24px 20px 40px; background:#15110e;
  }
  .cta-bar .btn{
    display:flex; align-items:center; justify-content:center;
    padding:15px 28px; border-radius:999px;
    font-family:'Nunito','Segoe UI',sans-serif;
    font-weight:700; font-size:15px; text-decoration:none;
    white-space:nowrap;
    transition:transform .15s ease, box-shadow .2s ease;
  }
  .cta-bar .btn:hover{ transform:translateY(-2px); }
  .cta-bar .btn-primary{
    flex:1 1 260px;
    color:#fff; position:relative; overflow:hidden;
    background:linear-gradient(105deg,#f98658 0%,#f25832 24%,#e62115 52%,#f25832 78%,#f98658 100%);
    box-shadow:0 10px 20px -10px rgba(221,0,3,0.6);
  }
  .cta-bar .btn-primary:hover{ box-shadow:0 14px 24px -10px rgba(221,0,3,0.7); }
  .cta-bar .btn-primary::before{
    content:"";
    position:absolute; inset:0;
    background:radial-gradient(circle at 22% 18%, rgba(255,255,255,0.35), transparent 55%);
    pointer-events:none;
  }
  .cta-bar .btn-primary::after{
    content:"";
    position:absolute; top:0; left:-60%; width:45%; height:100%;
    background:linear-gradient(100deg, transparent 0%, rgba(255,255,255,0.55) 50%, transparent 100%);
    animation:cta-btn-shine 3.6s ease-in-out infinite;
    pointer-events:none;
  }
  .cta-bar .btn-primary span{ position:relative; z-index:1; }
  @keyframes cta-btn-shine{
    0%{ transform:skewX(-18deg) translateX(0%); }
    55%{ transform:skewX(-18deg) translateX(422%); }
    100%{ transform:skewX(-18deg) translateX(422%); }
  }
  .cta-bar .btn-secondary{
    flex:1 1 200px;
    color:#fff; border:1.5px solid rgba(255,255,255,0.5);
  }
</style>
