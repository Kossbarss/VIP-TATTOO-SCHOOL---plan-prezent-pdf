  }
  .slide-btn-primary:hover{ box-shadow:0 14px 24px -10px rgba(221,0,3,0.7); transform:translateY(-2px); }
  .slide-btn-primary::before{

    position:absolute; inset:0;
    background:radial-gradient(circle at 22% 18%, rgba(255,255,255,0.35), transparent 55%);
    pointer-events:none;
  }
  .slide-btn-primary::after{

  .slide-btn-primary-label{ position:relative; z-index:1; }
  @keyframes slide-btn-shine{
